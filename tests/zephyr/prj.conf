CONFIG_ZTEST=y

# Language and compiler. No exceptions and no RTTI: the engine needs neither.
CONFIG_CPP=y
CONFIG_STD_CPP23=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_PICOLIBC=y
CONFIG_CPP_EXCEPTIONS=n
CONFIG_CPP_RTTI=n

# Compile() recurses once per nesting level; the limits test goes to the cap of 16.
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_ZTEST_STACK_SIZE=16384
CONFIG_HEAP_MEM_POOL_SIZE=65536

# The assertions print floats.
CONFIG_CBPRINTF_FP_SUPPORT=y

CONFIG_EXPRESSION_ENGINE=y
